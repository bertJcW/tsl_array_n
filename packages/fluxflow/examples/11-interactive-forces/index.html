<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>fluxflow — interactive forces</title>
	<style>
		body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 1.5rem; box-sizing: border-box; }
		#out { image-rendering: pixelated; width: 512px; height: 512px; border: 1px solid #333; touch-action: none; }
		#status { font-size: 0.9rem; line-height: 1.6; opacity: 0.85; }
		.err { color: #f87171; }
		p { max-width: 512px; font-size: 0.85rem; opacity: 0.7; margin: 0; }
	</style>
</head>
<body>
	<canvas id="out" width="32" height="32"></canvas>
	<div id="status">initializing…</div>
	<p>Red/blue = x-velocity, green/blue = y-velocity, gray = still. A gentle wind oscillates left-right over time. Click/drag to attract the field toward the pointer. Arrow keys add a directional push.</p>
	<script type="module" src="./main.js"></script>
</body>
</html>
